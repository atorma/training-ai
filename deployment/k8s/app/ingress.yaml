apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: training-ai
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.atorma.fi/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    # Above the app's attachment limit, so the app enforces it and explains; the default is 1m.
    nginx.ingress.kubernetes.io/proxy-body-size: 21m
spec:
  ingressClassName: nginx
  rules:
    - host: training-ai.atorma.fi
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: training-ai
                port:
                  number: 7932
  tls:
    - hosts:
        - training-ai.atorma.fi
      secretName: training-ai-certificate-secret