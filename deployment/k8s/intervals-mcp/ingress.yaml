apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intervals-mcp-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: intervals-mcp-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: intervals-mcp.atorma.fi
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intervals-mcp-service
                port:
                  number: 8000
  tls:
    - hosts:
        - intervals-mcp.atorma.fi
      secretName: intervals-mcp-certificate-secret
