[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-ai"
version = "0.1.0"
description = "Using OpenAI to do something with sports training data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai==2.55.0",
  "pydantic-ai-slim[web]==2.55.0",
  "python-dotenv>=1.2.1",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "prek>=0.5.5",
  "pytest>=9.0.2",
  "ruff>=0.17.0",
]

[project.scripts]
training-ai = "cli:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
py-modules = [
  "cli",
  "config",
  "conversation_api",
  "conversation_events",
  "conversation_store",
  "database_backup",
  "database_migrations",
  "signal_sender",
  "summary_agent",
  "summary_api",
  "training_agent",
  "web",
]
packages = ["web_assets"]

[tool.setuptools.package-data]
web_assets = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
