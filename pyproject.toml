[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-ai"
version = "0.1.0"
description = "Using OpenAI to do something with sports training data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai==2.55.0",
  "pydantic-ai-slim[web]==2.55.0",
  "python-dotenv>=1.2.1",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.4.0",
  "prek>=0.5.5",
  "pyright>=1.1.414",
  "pytest>=9.0.2",
  "ruff>=0.17.0",
]

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}
packages = ["training_ai"]

[tool.setuptools.package-data]
training_ai = ["web_assets/static/index.html", "web_assets/static/assets/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
