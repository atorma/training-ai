repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        language_version: "22"
        args: [--fix]
        stages: [pre-commit]
      - id: markdownlint-cli2
        alias: markdownlint-check
        name: markdownlint-cli2 (check only)
        language_version: "22"
        stages: [manual]
