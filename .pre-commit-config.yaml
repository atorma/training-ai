repos:
  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint and Prettier (frontend)
        entry: npm run lint
        language: system
        files: ^(src/frontend/|tests/frontend/|.*\.config\.(ts|js)$|package(-lock)?\.json$|tsconfig\.json$|index\.html$)
        pass_filenames: false
      - id: frontend-types
        name: TypeScript (frontend)
        entry: npm exec tsc -- --noEmit -p tsconfig.json
        language: system
        files: ^(src/frontend/|tests/frontend/|.*\.config\.ts$|tsconfig\.json$)
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        language_version: "22"
        args: [--fix]
        stages: [pre-commit]
      - id: markdownlint-cli2
        alias: markdownlint-check
        name: markdownlint-cli2 (check only)
        language_version: "22"
        stages: [manual]
